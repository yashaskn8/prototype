name: CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-security-and-tests:
    name: Backend Security & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System Check
        run: python manage.py check

      - name: Check Missing Migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Red Team Static Analysis (AST & Security Rules)
        run: python red_team_static.py

      - name: Red Team Offline Checks (Roles & Scoping)
        run: python red_team_offline.py

      - name: Real-Company Isolation Tests
        run: python manage.py test core.tests_real_company_isolation -v 2

      - name: Customer RAG End-to-End Tests
        run: python manage.py test core.tests_customer_rag_endtoend -v 2

      - name: Customer RAG Mutation Tests
        run: python manage.py test core.tests_customer_mutations -v 2

      - name: Run All Core Tests
        run: python manage.py test core -v 2

  frontend-build-and-lint:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
