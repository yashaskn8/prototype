name: CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only the newest commit on a ref needs a complete CI run. In particular,
  # cancel an obsolete long-running main run so the latest main SHA is tested
  # instead of remaining pending behind a superseded MySQL suite.
  cancel-in-progress: true

jobs:
  backend-security-and-tests:
    name: Backend Security & Tests (MySQL 8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: servy_test
          MYSQL_USER: servy_ci
          MYSQL_PASSWORD: servy_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-start-period=20s
          --health-retries=10
    env:
      SERVY_DB_ENGINE: mysql
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: servy_test
      MYSQL_USER: servy_ci
      MYSQL_PASSWORD: servy_ci_password
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          pip install --prefer-binary --disable-pip-version-check -r requirements.txt

      - name: Six-Role Production RAG Multi-Agent Red-Team
        run: python -m unittest tools.test_servy_rag_multiagent_redteam -v

      - name: Local Open-Weight Dialogue Planner Security Tests
        run: python -m unittest tools.test_servy_real_demo_local_planner -v

      - name: Real-data Demo Launcher Configuration Tests
        run: python -m unittest tools.test_servy_real_demo_launcher -v

      - name: Local Evidence-Bound Explanation Tests
        run: python -m unittest tools.test_servy_real_demo_explainer -v

      - name: Exhaustive Approved-Document Scan Tests
        run: python -m unittest tools.test_servy_real_demo_exhaustive -v

      - name: Exact-Model Manufacturer Web Research Safety Tests
        run: python -m unittest tools.test_servy_real_demo_web_research -v

      - name: Real-data Demo Focused Conversation Tests
        run: python -m unittest tools.test_servy_real_demo_dialogue -v

      - name: VRF Claim-Category and Checklist Leakage Regressions
        run: python -m unittest tools.test_servy_vrf_conversation -v
        env:
          LOCALAPPDATA: /tmp

      - name: Demo Issue Assignment and Cause Follow-up Tests
        run: python -m unittest tools.test_servy_real_demo_assignment -v
        env:
          LOCALAPPDATA: /tmp

      - name: Three-Asset / Nine-Manual Retrieval Scope Regressions
        run: python -m unittest tools.test_servy_three_asset_rag -v

      - name: Three-Asset Nine-Manual Readiness and Strict Serving Gate Tests
        run: python -m unittest tools.test_servy_three_asset_readiness -v
        env:
          LOCALAPPDATA: /tmp

      - name: Manual Statement Sentence Disclosure Tests
        run: python -m unittest tools.test_servy_manual_statement_sentences -v
        env:
          LOCALAPPDATA: /tmp

      - name: Three-Asset SME Training Export Safety Tests
        run: python -m unittest tools.test_servy_three_asset_training_export -v

      - name: Real-data Demo Signed Index Integrity and Chat Tests
        run: python -m unittest tools.test_servy_real_demo -v
        env:
          LOCALAPPDATA: /tmp

      - name: Code-gated Technician Ticket Isolation Tests
        run: python -m unittest tools.test_servy_technician_demo -v
        env:
          LOCALAPPDATA: /tmp
          SERVY_LOCAL_TICKET_DB_PATH: /tmp/servy-technician-ci/local-ticket-workspace.sqlite3

      - name: V5 Research Fine-Tuning Input Safety Tests
        run: python -m unittest discover -s tools -p "test_servy_v5_training_preflight.py" -v

      - name: V5 Private Artifact Structural Audit Tests
        run: python -m unittest discover -s tools -p "test_servy_v5_artifact_audit.py" -v

      - name: V5 Checkpoint Installer Safety Tests
        run: python -m unittest tools.test_install_servy_v5_checkpoint -v

      - name: V6 Continuation and Permission Safety Tests
        run: python -m unittest discover -s tools -p "test_servy_v6_continuation.py" -v

      - name: Frozen-Candidate Accuracy Diagnostics Regression Tests
        run: python -m unittest discover -s tools -p "test_servy_accuracy_diagnostics.py" -v

      - name: V6 Holdout Independence and Leakage Safety Tests
        run: python -m unittest discover -s tools -p "test_servy_v6_holdout_audit.py" -v

      - name: Verify MySQL Readiness
        run: python manage.py check_mysql_ready

      - name: Configure Disposable Test Database Privileges
        run: |
          python -c "import pymysql; conn = pymysql.connect(host='127.0.0.1', user='root', password='root_ci_password'); c = conn.cursor(); c.execute('GRANT ALL PRIVILEGES ON \`test_%\`.* TO \'servy_ci\'@\'%\''); c.execute('FLUSH PRIVILEGES'); conn.close(); print('Scoped test_% privileges granted to servy_ci successfully.')"

      - name: Apply Migrations on MySQL
        run: python manage.py migrate

      - name: Django System Check
        run: python manage.py check

      - name: Check Missing Migrations
        run: python manage.py makemigrations --check --dry-run

      - name: RAG Serving Diagnostic (read only)
        run: python manage.py check_rag_serving

      - name: RAG Serving Gate and Local Generator Unit Tests
        run: python manage.py test core.tests_rag_serving_gate core.tests_serving_truth core.tests_customer_answer_generation -v 2

      - name: Three-Asset / Nine-Manual V5 Retrieval Regressions
        run: python manage.py test core.tests_three_asset_retrieval -v 2

      - name: Experimental Section-Aware Reranker Unit Tests (default remains off)
        run: python manage.py test core.tests_section_aware_rerank -v 2

      - name: RAG Accuracy Red-Team Unit Tests
        run: python manage.py test core.tests_accuracy_redteam -v 2

      - name: Red Team Static Analysis (AST & Security Rules)
        run: python red_team_static.py

      - name: Red Team Offline Checks (Roles & Scoping)
        run: python red_team_offline.py

      - name: Real-Company Isolation Tests
        run: python manage.py test core.tests_real_company_isolation -v 2

      - name: Customer RAG End-to-End Tests
        run: python manage.py test core.tests_customer_rag_endtoend -v 2

      - name: Customer RAG Mutation Tests
        run: python manage.py test core.tests_customer_mutations -v 2

      - name: Run All Core Tests on MySQL
        run: python manage.py test core -v 2

  frontend-build-and-lint:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Test Customer Answer Contract
        working-directory: frontend
        run: node --test test/customerAnswerContract.test.mjs test/customer-answer-contract.test.js test/demoThreadState.test.mjs test/onlineResearchContract.test.mjs          test/ragExecutionStream.test.mjs

      - name: Test Private Technician Access-code Instance
        working-directory: frontend
        run: node --test test/technicianSecretInstance.test.mjs

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
