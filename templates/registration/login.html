{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • Servy RAG</title><link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}"><link rel="stylesheet" href="{% static 'core/css/servy.css' %}"></head>
<body class="login-page"><div class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-4"><div class="card p-4"><div class="text-center mb-4"><div class="servy-logo">Servy</div><div class="text-secondary">Secure local RAG prototype</div></div>{% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}<form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" autocomplete="username" required></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" autocomplete="current-password" required></div><button class="btn btn-servy w-100">Sign in</button></form><div class="small-muted mt-3">Demo users are listed in README.md. Change passwords before using real data.</div></div></div></div></div></body></html>
