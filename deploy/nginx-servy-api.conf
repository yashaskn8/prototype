# nginx reverse proxy with TLS for the Servy API. Replace api.example.com and the
# certificate paths with the real host name and certificates.
server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/ssl/servy/fullchain.pem;
    ssl_certificate_key /etc/ssl/servy/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 30m;            # ticket attachments (25 MB total)

    # Only the API and health probes are published; no /admin, no /app (React).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Server-sent events: do not buffer the messages-stream responses.
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        return 404;
    }
}
